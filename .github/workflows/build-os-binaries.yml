name: Build/release (DISABLED)

# This workflow is disabled - OS binaries are not built for this project
# on:
#   release:
#     types: [created]

on:
  workflow_dispatch: # Manual trigger only if re-enabled

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build static files
        run: npm run build --if-present
      - name: Build/release Electron app ${{ matrix.os }}
        run: npm run make
